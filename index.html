<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f4f3ed" />
		<title>SecondServe | Second chances for food</title>
		<link rel="stylesheet" href="./style.css">
	</head>
	<body>
		<div id="root"></div>
		<script>
			// Ensure root element exists before loading scripts
			if (!document.getElementById('root')) {
				document.body.innerHTML = '<div id="root"></div>';
			}
		</script>
		<script defer src="./local-api.js"></script>
		<script defer src="./script.js"></script>
		<script>
			// Global error handler to catch initialization errors
			window.addEventListener('error', function(event) {
				console.error('Application error:', event.error);
			});
			window.addEventListener('unhandledrejection', function(event) {
				console.error('Unhandled promise rejection:', event.reason);
			});
		</script>
	</body>
</html>
